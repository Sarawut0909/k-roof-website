<body>
<header class="top"><div class="brand"><div class="logo"><i>K</i>R</div><div><b>K-Roof V2</b><small>Roof Calculator • สำหรับ iPad</small></div></div></header>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main><div class="foot">K-Roof • โปรแกรมคำนวณแผ่นหลังคา</div><div class="toast" id="toast"></div>
<script>
const products={
 snow:{name:'VG SnowRoof',sub:'iR-uPVC • หน้ากว้าง 0.262 ม.',width:.262,lengths:[3,3.5,4,4.5,5,5.5,6,6.5],dw:4.5,dl:1.7},
 winter:{name:'แผ่นวินเทอร์รูฟ',sub:'เหมือน SnowRoof • หน้ากว้าง 1.00 ม.',width:1,lengths:[3,3.5,4,4.5,5,5.5,6,6.5],dw:4.5,dl:1.7},
 winterplus:{name:'แผ่นวินเทอร์พลัส',sub:'เหมือน SnowRoof • หน้ากว้าง 0.76 ม.',width:.76,lengths:[3,3.5,4,4.5,5,5.5,6,6.5],dw:4.5,dl:1.7},
 roofy:{name:'RoofyRoof',sub:'ไวนิล • หน้ากว้าง 0.25 ม.',width:.25,lengths:[4,5,6],dw:5,dl:2.7},
 glacia:{name:'VG Glacia Roof',sub:'หน้ากว้าง 0.334 ม.',width:.334,lengths:[3,3.5,4,4.5,5,5.5,6,6.5,7],dw:6,dl:2.9},
 jroof:{name:'JROOF / Mini Gold',sub:'แผ่นหน้ากว้าง 1.00 ม.',width:1,lengths:[3,4,5,6,8,9,10,11,12],dw:6,dl:5.8}
};
const tabs=[['snow','SnowRoof'],['winter','วินเทอร์รูฟ'],['winterplus','วินเทอร์พลัส'],['roofy','RoofyRoof'],['glacia','VG Glacia'],['jroof','JROOF / MiniGold'],['multi','หลายส่วน'],['roof2','คำนวนสันตะเข้'],['help','วิธีติดตั้ง']];
const tabsEl=document.getElementById('tabs'),app=document.getElementById('app');
tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t[1];b.onclick=()=>show(t[0]);if(i===0)b.className='active';tabsEl.appendChild(b)});
function show(id){document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',tabs[i][0]===id));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+id)?.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function num(v){const x=parseFloat(v);return Number.isFinite(x)?x:0}function up(x){return Math.ceil(x)}function fmt(x,d=2){return Number.isFinite(x)?x.toLocaleString('th-TH',{maximumFractionDigits:d}):'-'}
function buildProduct(key){
 const p=products[key],el=document.createElement('section');el.id='p-'+key;el.className='panel'+(key==='snow'?' active':'');
 el.innerHTML=`<div class="hero"><div class="ey">K-ROOF CALCULATOR</div><h1>${p.name}</h1><p>${p.sub}</p></div>
 <div class="card"><div class="title">⚙️ ข้อมูลหน้างาน</div><div class="grid">
 <div class="field"><label>ความกว้างโครงหลังคา</label><input id="${key}-w" type="number" inputmode="decimal" step="0.01" value="${p.dw}"><div class="unit">เมตร</div></div>
 <div class="field"><label>ระยะยื่น / ความยาวลาด</label><input id="${key}-l" type="number" inputmode="decimal" step="0.01" value="${p.dl}"><div class="unit">เมตร</div></div>
 <div class="field"><label>หน้ากว้างแผ่น</label><input id="${key}-pw" type="number" inputmode="decimal" step="0.001" value="${p.width}"><div class="unit">เมตร</div></div>
 </div><div class="actions"><button class="btn gold" onclick="calcProduct('${key}')">▣ คำนวณ</button><button class="btn light" onclick="resetProduct('${key}')">⟳ รีเซ็ต</button></div></div>
 <div class="card"><div class="title">📊 ผลคำนวณ</div>
 <div class="results">
 <div class="metric fit"><small>📏 ความยาวแผ่นที่พอดี</small><strong id="${key}-fit">-</strong><div class="sub">ความยาวที่ให้เศษรวมน้อยที่สุด</div></div>
 <div class="metric qty"><small>▰ ใช้จำนวน</small><strong id="${key}-full">-</strong><div class="sub">จำนวนแผ่นที่ต้องซื้อ</div></div>
 <div class="metric cut"><small>✂️ ชิ้นที่ได้</small><strong id="${key}-cut">-</strong><div class="sub">จำนวนที่ตัดได้ต่อ 1 แผ่น</div></div>
 <div class="metric total"><small>▰ ตัดได้/แผ่น</small><strong id="${key}-got">-</strong><div class="sub">รวมชิ้นที่ได้ตามความกว้าง</div></div>
 </div><div class="summary" id="${key}-summary">-</div></div>
 <div class="card"><div class="title">📄 วิเคราะห์การตัดและเศษ</div><div class="tablewrap"><table class="tbl"><thead><tr><th>แผ่นมาตรฐาน</th><th>ตัดได้/แผ่น</th><th>ใช้กี่แผ่น</th><th>ชิ้นที่ได้</th><th>เศษ/แผ่น (ม.)</th><th>เศษรวม (ม.)</th></tr></thead><tbody id="${key}-tbody"></tbody></table></div><div id="${key}-recommended" class="recommended">-</div></div>`;
 app.appendChild(el);['w','l','pw'].forEach(x=>document.getElementById(`${key}-${x}`).addEventListener('input',()=>calcProduct(key)));calcProduct(key)
}
function calcProduct(key){
 const p=products[key],w=num(document.getElementById(key+'-w').value),l=num(document.getElementById(key+'-l').value),pw=num(document.getElementById(key+'-pw').value);
 if(w<=0||l<=0||pw<=0)return;
 const pieces=up(w/pw);let best=null;const tb=document.getElementById(key+'-tbody');tb.innerHTML='';
 p.lengths.forEach(len=>{
  const cut=len>=l?Math.floor(len/l):0,use=cut?up(pieces/cut):0,got=cut*use,scrap=cut?len-cut*l:0,total=use*scrap;
  if(cut){const waste=total*1000;if(!best||waste<best.waste||(waste===best.waste&&scrap<best.scrap)||(waste===best.waste&&scrap===best.scrap&&use<best.use))best={len,cut,use,got,scrap,total,waste}}
  const tr=document.createElement('tr');tr.innerHTML=`<td>${len.toFixed(1)} ม.</td><td>${cut||0}</td><td>${use||0}</td><td>${got||0}</td><td>${cut?fmt(scrap,2):'-'}</td><td>${cut?fmt(total,2):'-'}</td>`;tb.appendChild(tr)
 });
 const fit=best?best.len:null,full=best?best.use:null;
 document.getElementById(key+'-fit').textContent=fit?fmt(fit,1)+' เมตร':'เกิน '+Math.max(...p.lengths)+' ม.';
 document.getElementById(key+'-full').textContent=full!=null?fmt(full,0)+' แผ่น':'-';
 document.getElementById(key+'-cut').textContent=best?fmt(best.cut,0)+' ชิ้น/แผ่น':'-';
 document.getElementById(key+'-got').textContent=best?fmt(best.got,0)+' ชิ้น':'-';
 const sum=document.getElementById(key+'-summary'),rec=document.getElementById(key+'-recommended');
 if(!best){sum.innerHTML=`<b>⚠️ ความยาวเกินขนาดมาตรฐาน</b><br>สูงสุด ${Math.max(...p.lengths)} ม. ต้องแบ่งแนวหรือใช้วิธีต่อ`;rec.textContent='ต้องปรับความยาวลาดก่อนคำนวณ';return}
 sum.innerHTML=`ต้องใช้ <b>${fmt(pieces,0)} ชิ้น/แนว</b> × <b>1 แนว</b> = <b>${fmt(best.use,0)} แผ่น</b> • แผ่นละตัดได้ <b>${fmt(best.cut,0)} ชิ้น</b> • รวม <b>${fmt(best.got,0)} ชิ้น</b> โดยเลือกขนาดที่มีเศษรวมน้อยที่สุด`;
 rec.innerHTML=`ขนาดที่มีเศษน้อยที่สุด: <b>${best.len.toFixed(1)} ม.</b> → ตัดได้ ${best.cut} ชิ้น/แผ่น | ใช้ ${best.use} แผ่น | เศษ/แผ่น ${fmt(best.scrap,2)} ม. | <b>เศษรวม ${fmt(best.total,2)} ม.</b>`
}
function resetProduct(key){const p=products[key];document.getElementById(key+'-w').value=0;document.getElementById(key+'-l').value=0;document.getElementById(key+'-pw').value=p.width;calcProduct(key);toast('รีเซ็ตค่าหน้างานเป็น 0 แล้ว')}
Object.keys(products).forEach(buildProduct);
function buildMulti(){const el=document.createElement('section');el.id='p-multi';el.className='panel';el.innerHTML=`<div class="hero"><div class="ey">CUSTOM CUT CALCULATOR</div><h1>คำนวณหลายส่วน</h1><p>ขนาดสินค้าไม่ตายตัว • หน่วยเซนติเมตร • คำนวณชิ้นเต็ม ชิ้นตัด และจำนวนที่ใช้จริง</p></div><div class="card"><div class="title">รายการหน้างาน</div><div class="multi-head"><span>ส่วน</span><span>กว้างโครง</span><span>ยาวโครง</span><span>กว้างสินค้า</span><span>ยาวสินค้า</span></div><div id="multiRows"></div><div class="actions"><button class="btn gold" onclick="addMulti()">+ เพิ่มส่วน</button><button class="btn light" onclick="clearMulti()">ล้างทั้งหมด</button></div></div><div class="card"><div class="title">สรุปรวม</div><div class="results"><div class="metric primary"><small>รวมชิ้นที่ใช้</small><strong id="mtotal">0</strong></div><div class="metric"><small>รวมแผ่นสต๊อก</small><strong id="mstock">0</strong></div><div class="metric"><small>เศษรวม</small><strong id="mscrap">0 ซม.</strong></div><div class="metric"><small>จำนวนส่วน</small><strong id="msections">0</strong></div></div><div class="summary" id="mnotes">กรอกข้อมูลเพื่อคำนวณ</div></div>`;app.appendChild(el);for(let i=0;i<6;i++)addMulti()}

(function initRoof2V7(){

const STOCK=[3,3.5,4,4.5,5,5.5,6,6.5,7];
const $=id=>document.getElementById(id);
const n=v=>{const x=parseFloat(String(v).replace(/,/g,''));return Number.isFinite(x)?x:0};
const fmt=(x,d=2)=>x.toLocaleString('th-TH',{maximumFractionDigits:d});
const EPS=1e-9;
let diagonal='AD';

STOCK.forEach(L=>{
  const l=document.createElement('label');
  l.className='check';
  l.innerHTML=`<input type="checkbox" value="${L}" checked> ${L} ม.`;
  $('lengths').appendChild(l);
});

function selected(){return [...document.querySelectorAll('#lengths input:checked')].map(x=>+x.value).sort((a,b)=>a-b)}

function svgEl(name,attrs){
  const e=document.createElementNS('http://www.w3.org/2000/svg',name);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  return e;
}
function arrow(x1,y1,x2,y2){
  const g=svgEl('g',{stroke:'#b33a32','stroke-width':'4',fill:'none','stroke-linecap':'round','stroke-linejoin':'round'});
  const l=svgEl('line',{x1,y1,x2,y2});
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
  const px=-uy,py=ux, size=13;
  const a1=`${x2-ux*size+px*size*.75},${y2-uy*size+py*size*.75}`;
  const a2=`${x2-ux*size-px*size*.75},${y2-uy*size-py*size*.75}`;
  const h=svgEl('polyline',{points:`${a1} ${x2},${y2} ${a2}`});
  g.append(l,h);return g;
}
function drawArrows(){
  const layer=$('arrowLayer');layer.innerHTML='';
  const xL=80,xR=680,yT=55,yB=440,W=600,H=385;
  if(diagonal==='AD'){
    // Upper-right triangle: vertical arrows stay to the RIGHT of A-D.
    for(let x=190;x<=620;x+=105){
      const yDiag=yT+(x-xL)*H/W;
      const top=yT+35, bottom=Math.max(top+35,yDiag-25);
      if(bottom>top) layer.appendChild(arrow(x,bottom,x,top));
    }
    // Lower-left triangle: horizontal arrows stay BELOW A-D.
    for(let y=150;y<=400;y+=75){
      const xDiag=xL+(y-yT)*W/H;
      const left=xL+35, right=Math.max(left+35,xDiag-25);
      if(right>left) layer.appendChild(arrow(right,y,left,y));
    }
  }else{
    // Upper-left triangle: horizontal arrows stay ABOVE C-B.
    for(let y=85;y<=350;y+=70){
      const xDiag=xL+(yB-y)*W/H;
      const left=xL+35,right=Math.max(left+35,xDiag-25);
      if(right>left) layer.appendChild(arrow(right,y,left,y));
    }
    // Lower-right triangle: vertical arrows stay to the RIGHT of C-B.
    for(let x=180;x<=640;x+=105){
      const yDiag=yB-(x-xL)*H/W;
      const top=Math.min(yB-35,yDiag+25), bottom=yB-35;
      if(bottom>top) layer.appendChild(arrow(x,bottom,x,top));
    }
  }
}

function updateDiagram(){
  const ad=diagonal==='AD';
  $('diag').setAttribute('x1',ad?'80':'80');
  $('diag').setAttribute('y1',ad?'55':'440');
  $('diag').setAttribute('x2',ad?'680':'680');
  $('diag').setAttribute('y2',ad?'440':'55');
  drawArrows();
  if(ad){
    $('label1').textContent='ฝั่ง 1 • น้ำไหลขึ้น';
    $('label1').setAttribute('x','470');$('label1').setAttribute('y','90');
    $('label2').textContent='ฝั่ง 2 • น้ำไหลซ้าย';

  }else{
    $('label1').textContent='ฝั่ง 1 • น้ำไหลซ้าย';
    $('label1').setAttribute('x','180');$('label1').setAttribute('y','90');
    $('label2').textContent='ฝั่ง 2 • น้ำไหลลง';
    $('label2').setAttribute('x','500');$('label2').setAttribute('y','410');
  }
}

function dimensions(){
  // For normal rectangular jobs use opposite-side averages.
  // This keeps the four input fields usable while the diagonal calculation
  // remains based on the resulting plan dimensions.
  return {
    W:(n($('ab').value)+n($('dc').value))/2,
    H:(n($('bd').value)+n($('ca').value))/2
  };
}

function makePieces(W,H,pw){
  const zone1=[],zone2=[];
  if(diagonal==='AD'){
    // Zone 1: upper-right triangle, sheets run vertically.
    // Each sheet is pw wide; use the maximum required length in that strip.
    const count1=Math.ceil(W/pw-EPS);
    for(let i=0;i<count1;i++){
      const x2=Math.min(W,(i+1)*pw);
      const len=H*x2/W;
      if(len>EPS)zone1.push({index:i+1,need:len});
    }
    // Zone 2: lower-left triangle, sheets run horizontally.
    const count2=Math.ceil(H/pw-EPS);
    for(let i=0;i<count2;i++){
      const y2=Math.min(H,(i+1)*pw);
      const len=W*y2/H;
      if(len>EPS)zone2.push({index:i+1,need:len});
    }
  }else{
    // Zone 1: upper-left triangle, sheets run horizontally.
    const count1=Math.ceil(H/pw-EPS);
    for(let i=0;i<count1;i++){
      const y2=Math.min(H,(i+1)*pw);
      const len=W*y2/H;
      if(len>EPS)zone1.push({index:i+1,need:len});
    }
    // Zone 2: lower-right triangle, sheets run vertically.
    const count2=Math.ceil(W/pw-EPS);
    for(let i=0;i<count2;i++){
      const x2=Math.min(W,(i+1)*pw);
      const len=H*x2/W;
      if(len>EPS)zone2.push({index:i+1,need:len});
    }
  }
  return {zone1,zone2};
}

function pack(items,stock){
  // Best-fit decreasing. Keep this deterministic and finite so the iPad
  // browser cannot get stuck while recalculating on user input.
  if(!items.length)return {bins:[],count:0,waste:0};
  const sorted=[...items].sort((a,b)=>b.need-a.need);

  for(const item of sorted){
    if(item.need>Math.max(...stock)+EPS)return null;
  }

  // Try all available stock sizes as bins, then choose the result with
  // the fewest stock sheets and, for ties, the least waste.
  let best=null;

  for(const preferred of stock){
    const bins=[];
    for(const item of sorted){
      // Best-fit existing bin.
      let bestBin=null;
      let bestRemain=Infinity;
      for(const b of bins){
        const remain=b.rem-item.need;
        if(remain>=-EPS && remain<bestRemain){
          bestRemain=remain;
          bestBin=b;
        }
      }

      if(bestBin){
        bestBin.items.push(item);
        bestBin.rem-=item.need;
      }else{
        // Prefer the selected candidate stock size only if it fits;
        // otherwise use the smallest available stock that fits.
        const candidates=stock.filter(L=>L+EPS>=item.need);
        if(!candidates.length)return null;
        let L=candidates.find(x=>x===preferred);
        if(L==null)L=candidates[0];
        bins.push({L,rem:L-item.need,items:[item]});
      }
    }

    const waste=bins.reduce((s,b)=>s+b.rem,0);
    const candidate={bins,count:bins.length,waste};
    if(!best ||
       candidate.count<best.count ||
       (candidate.count===best.count && candidate.waste<best.waste-EPS)){
      best=candidate;
    }
  }

  return best;
}
function groups(bins){
  const map=new Map();
  for(const b of bins){
    const key=b.L.toFixed(1);
    if(!map.has(key))map.set(key,{L:b.L,count:0,pieces:0,waste:0,bins:[]});
    const g=map.get(key);g.count++;g.pieces+=b.items.length;g.waste+=b.rem;g.bins.push(b);
  }
  return [...map.values()].sort((a,b)=>a.L-b.L);
}

function summaryHTML(gs,total){
  if(!gs.length)return 'ไม่มีรายการ';
  return gs.map(g=>`${g.L.toFixed(1)} ม. = <b>${g.count} แผ่น</b>`).join('<br>')+
    `<div style="margin-top:6px">รวม = <b>${total} แผ่น</b></div>`;
}

function renderZone(title,items,result,sideClass){
  const box=document.createElement('div');box.className='card';
  const gs=groups(result.bins);
  const rows=gs.map(g=>`<tr><td>${g.L.toFixed(1)} ม.</td><td>${g.count}</td><td>${g.pieces}</td><td>${fmt(g.waste,2)} ม.</td></tr>`).join('');
  const cuts=gs.map(g=>`<b>${g.count} แผ่น × ${g.L.toFixed(1)} ม.</b><br>`+
    g.bins.map((b,i)=>`แผ่น ${i+1}: ${b.items.map(x=>fmt(x.need,2)+' ม.').join(' + ')} → เหลือ ${fmt(b.rem,2)} ม.`).join('<br>')
  ).join('<br>');
  box.innerHTML=`
    <div style="font-size:18px;font-weight:900">${title}</div>
    <div class="note">จำนวนแนว ${items.length} แนว • ความยาวแต่ละแนวคำนวณจากเส้นทแยงมุม</div>
    <div class="tablewrap">
      <table class="tbl"><thead><tr><th>ขนาดแผ่นมาตรฐาน</th><th>จำนวนแผ่น</th><th>ชิ้นที่ตัดได้</th><th>เศษรวม</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div class="good">ฝั่งนี้ใช้ <b>${result.count} แผ่น</b> • เศษรวม <b>${fmt(result.waste,2)} ม.</b></div>
    <div class="cutbox">${cuts}</div>`;
  $('out').appendChild(box);
  return {groups:gs,count:result.count,waste:result.waste};
}

let calculating=false;
function calculate(){
  if(calculating)return;
  calculating=true;
  try{
  const {W,H}=dimensions();
  const pw=n($('pw').value), stock=selected();
  if(W<=0||H<=0||pw<=0||!stock.length){
    $('summary').innerHTML='<b>กรุณากรอกข้อมูลให้ครบ</b>';return;
  }
  const pieces=makePieces(W,H,pw);
  const all=[...pieces.zone1,...pieces.zone2];
  if(all.some(x=>x.need>Math.max(...stock)+EPS)){
    $('summary').innerHTML='<b>มีบางแนวยาวเกินความยาวแผ่นมาตรฐานที่เลือก</b>';
    $('out').innerHTML='';$('sideSummary').innerHTML='';return;
  }

    $('summary').innerHTML='<b>ไม่สามารถจัดชุดตัดจากความยาวที่เลือกได้</b>';return;
  }

  $('out').innerHTML='';

  const b=renderZone(diagonal==='AD'?'ฝั่ง 2 — น้ำไหลซ้าย':'ฝั่ง 2 — น้ำไหลลง',pieces.zone2,r2,'side2');

  $('total').textContent=allPack.count;
  $('pieces').textContent=all.length;
  $('summary').innerHTML=`ขนาดโครงประมาณ <b>${fmt(W,2)} × ${fmt(H,2)} ม.</b> • เส้นแบ่ง <b>${diagonal==='AD'?'A → D':'C → B'}</b> • หน้ากว้างแผ่น <b>${fmt(pw,2)} ม.</b>`;

  $('sideSummary').innerHTML=`
    <div class="sidebox side1"><h3>ฝั่ง 1 ใช้ขนาด</h3>${summaryHTML(a.groups,a.count)}</div>
    <div class="sidebox side2"><h3>ฝั่ง 2 ใช้ขนาด</h3>${summaryHTML(b.groups,b.count)}</div>`;
  }finally{
    calculating=false;
  }
}
